<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Page not found — Nils Schröder</title>
    <script>
      if (!location.pathname.startsWith('/Portfolio/')) {
        location.replace('/Portfolio/' + location.pathname.replace(/^\/+/, '') + location.search + location.hash);
      }
    </script>
  </head>
  <body><p>Page not found. <a href="/Portfolio/">Open the portfolio</a>.</p></body>
</html>
